<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Mini-OJ Trusted Worker</title>
  <style>
    body { font-family: 'Microsoft YaHei', sans-serif; background: #f5f5f5; margin: 0; padding: 16px; }
    h1 { font-size: 18px; color: #d9534f; margin: 0 0 4px; }
    .sub { color: #888; font-size: 12px; margin-bottom: 16px; }
    .box { background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 12px; }
    .status { font-family: Consolas, monospace; font-size: 12px; line-height: 1.8; max-height: 340px; overflow-y: auto; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #5cb85c; margin-right: 6px; vertical-align: middle; }
  </style>
</head>
<body>
  <h1>Mini-OJ Trusted Worker</h1>
  <div class="sub">可信 Windows 评测机 · WSL2 + Isolate 沙箱 · 证书身份 · 运行时自检</div>
  <div class="box">
    <div><span class="dot"></span><span id="state">运行中</span></div>
    <div class="status" id="log">等待日志…</div>
  </div>
  <script>
    const { ipcRenderer } = require('electron');
    ipcRenderer.on('status', (e, data) => {
      document.getElementById('log').textContent = data.lines.join('\n') || '等待日志…';
    });
  </script>
</body>
</html>
