# ============================================================
# Mini-OJ 双域名 + SSE 透传 Nginx 配置
# - contest.example.com → 选手端
# - admin.example.com   → 管理端
# - /api/*/events/stream 关闭缓冲，保证 SSE 长连接
# ============================================================
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    access_log /var/log/nginx/access.log;
    # 浏览器 Runtime 体积较大；对代理返回的 JS/WASM 启用传输压缩。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/javascript application/wasm application/json text/css text/plain;

    upstream oj_app {
        server app1:3000;
        server app2:3000 backup;   # 扩容时启用
    }

    # SSE 长连接通用 location 片段（避免重复）
    # Phase 5 新增比赛内 Scoreboard SSE：/api/contest/contests/:cid/events 同样需关闭缓冲。
    map $request_uri $is_sse {
        ~^/api/.+/events/stream                1;
        ~^/api/contest/contests/[^/]+/events   1;
        ~^/api/worker/[^/]+/stream             1;
        default                                0;
    }

    server {
        listen 80;
        server_name contest.example.com;

        location / {
            proxy_pass http://oj_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # SSE：关闭缓冲，放大读取超时
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            chunked_transfer_encoding off;

            # cross-origin isolation（SharedArrayBuffer 依赖，C/C++ WASI + Python Pyodide 均需）：
            # COOP/COEP 由后端 Express（server/src/app.js）对 contest 入口下发，经 proxy_pass
            # 原样透传给浏览器。若在本层设置需保证与后端一致，禁止覆盖为 non-isolated。
            # add_header Cross-Origin-Opener-Policy "same-origin" always;
            # add_header Cross-Origin-Embedder-Policy "require-corp" always;
        }
    }

    server {
        listen 80;
        server_name admin.example.com;

        location / {
            proxy_pass http://oj_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
    }
}
