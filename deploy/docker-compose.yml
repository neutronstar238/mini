# ============================================================
# Mini-OJ 容器化编排
# 一键启动：docker compose -f deploy/docker-compose.yml up -d
# - app1: 主应用实例（挂载数据卷持久化 SQLite）
# - app2: 扩容备用实例（默认副本数 1，扩容演示时 scale 2）
# - nginx: 反向代理 + 双域名分发 + SSE 透传
# ============================================================
services:
  app1:
    build:
      context: ../server
      dockerfile: Dockerfile
    image: mini-oj-server:latest
    container_name: mini-oj-app1
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - JWT_SECRET=change-me-in-prod
      - HMAC_SECRET=change-me-in-prod
      - DOMAIN_CONTEST=contest.example.com
      - DOMAIN_ADMIN=admin.example.com
    volumes:
      - oj_data:/app/data        # SQLite 数据库持久化
    restart: unless-stopped

  app2:
    image: mini-oj-server:latest
    container_name: mini-oj-app2
    depends_on:
      - app1
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - JWT_SECRET=change-me-in-prod
      - HMAC_SECRET=change-me-in-prod
      - DOMAIN_CONTEST=contest.example.com
      - DOMAIN_ADMIN=admin.example.com
    volumes:
      - oj_data:/app/data
    restart: unless-stopped
    # 横向扩容演示：docker compose up -d --scale app2=2
    deploy:
      replicas: 1

  nginx:
    image: nginx:1.27-alpine
    container_name: mini-oj-nginx
    depends_on:
      - app1
      - app2
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  oj_data:
